name: Release

on:
  push:
    branches:
      - main
  # Rebuilds and republishes an existing release tag, with the same jobs as a release.
  # For a release whose run never finished (#144). stores limits it to some stores, so
  # a version already in review elsewhere is not resubmitted (#147).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish, e.g. v2.5.0'
        required: true
        type: string
      stores:
        description: 'Stores to publish to: all, or a comma list of chrome, edge, firefox'
        required: false
        default: 'all'
        type: string

# Runs queue instead of cancelling each other: a run that has created a release tag
# must reach the store jobs (#144). A queued run that GitHub replaces is harmless,
# since the next run's release-please step picks up any release still pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only default. Jobs add only the scopes they use.
permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # The action authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN,
    # so release PRs still trigger CI. GITHUB_TOKEN needs nothing more.
    permissions:
      contents: read

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # No release-type input: with one, the action ignores release-please-config.json
          # and .release-please-manifest.json, so the manifest.json extra-file never
          # applied (#144). The release type lives in the config file.

  # The tag to build: the one release-please just created, or the dispatch input.
  target:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      stores: ${{ steps.stores.outputs.stores }}

    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Release::'$TAG' is not a release tag like v2.5.0."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      # A push always publishes everywhere. The output is wrapped in commas, like
      # ",chrome,firefox,", so each publish job can match its own name exactly.
      - name: Resolve stores
        id: stores
        env:
          STORES: ${{ github.event_name == 'workflow_dispatch' && inputs.stores || 'all' }}
        run: |
          list="$(echo "$STORES" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$list" ] || [ "$list" = "all" ]; then
            list="chrome,edge,firefox"
          fi
          IFS=',' read -ra names <<< "$list"
          for name in "${names[@]}"; do
            case "$name" in
              chrome|edge|firefox) ;;
              *)
                echo "::error title=Release::Unknown store '$name'. Use all, or a comma list of chrome, edge, firefox."
                exit 1
                ;;
            esac
          done
          echo "Publishing to: $list"
          echo "stores=,$list," >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false

      # The build stamps manifest.json from package.json (npm run sync-version), and the
      # AMO and Edge notes read package.json too, so the tag's package.json must match.
      - name: Check package.json version matches the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error title=Release::package.json at $TAG is $VERSION, expected ${TAG#v}."
            exit 1
          fi

  build-release:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    # contents: write lets action-gh-release attach dist/*.zip to the release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all browser packages
        run: npm run build:all

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.target.outputs.tag }}
          files: dist/*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: dist/*.zip
          retention-days: 1

  publish-to-chrome:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && contains(needs.target.outputs.stores, ',chrome,') }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      # Chrome Web Store API V2. V1.1 stops working on 2026-10-15.
      # https://developer.chrome.com/blog/cws-api-v2
      - name: Check Chrome publisher ID
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          if [ -z "$CHROME_PUBLISHER_ID" ]; then
            echo "::error title=Chrome::Repository variable CHROME_PUBLISHER_ID is not set. Find it in the Chrome Web Store Developer Dashboard under Publisher > Settings."
            exit 1
          fi

      # Uploads, waits up to 60 seconds for the upload to finish, then publishes with
      # DEFAULT_PUBLISH. Visibility comes from the Developer Dashboard.
      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/*-chrome.zip
          extension-id: bgildcbomgimjfoblhlhmaehaeieeaam
          publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
          glob: true

  publish-to-firefox:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && contains(needs.target.outputs.stores, ',firefox,') }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      # Checkout first: it cleans the workspace, so it must run before the download.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # A rerun for a version AMO already has must not upload again (AMO answers 409
      # "Version X already exists"), but must still set the notes and previews.
      - name: Check whether AMO already has this version
        id: amo-version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-release.js --check-version

      - name: Upload to Firefox Add-ons
        id: upload
        if: steps.amo-version.outputs.exists != 'true'
        continue-on-error: true
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'geocaching-friends-logs@rfsbraz.github.io'
          xpi-path: dist/*-firefox.zip
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}

      # A failed upload is fine only if AMO has the version anyway (a 409 from a race
      # with an earlier attempt). Otherwise the job fails here.
      - name: Confirm AMO has this version
        if: steps.upload.outcome == 'failure'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-release.js --check-version --require

      # The action cannot send release notes or previews, so this step does it with the
      # same AMO key: the CHANGELOG.md section for this version becomes the release
      # notes, and the listing previews are synced to store-listing/assets/screenshot-N.png.
      # See store-listing/FIREFOX_RELEASE.md.
      - name: Set AMO release notes and previews
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-release.js --apply

  publish-to-edge:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && contains(needs.target.outputs.stores, ',edge,') }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      # Checkout first: it cleans the workspace, so it must run before the download.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Testing steps from store-listing/edge-certification-notes.txt plus the
      # CHANGELOG.md section for this version. See store-listing/EDGE_CERTIFICATION.md.
      - name: Build notes for certification
        id: notes
        run: node scripts/edge-cert-notes.js --github-output

      - name: Upload to Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: dist/*-edge.zip
          notes-for-certification: ${{ steps.notes.outputs.notes }}
