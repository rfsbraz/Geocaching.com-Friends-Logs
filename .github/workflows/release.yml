name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only default. Jobs add only the scopes they use.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The action authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN,
    # so release PRs still trigger CI. GITHUB_TOKEN needs nothing more.
    permissions:
      contents: read

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # contents: write lets action-gh-release attach dist/*.zip to the release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all browser packages
        run: npm run build:all

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: dist/*.zip
          retention-days: 1

  publish-to-chrome:
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      # Chrome Web Store API V2. V1.1 stops working on 2026-10-15.
      # https://developer.chrome.com/blog/cws-api-v2
      - name: Check Chrome publisher ID
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          if [ -z "$CHROME_PUBLISHER_ID" ]; then
            echo "::error title=Chrome::Repository variable CHROME_PUBLISHER_ID is not set. Find it in the Chrome Web Store Developer Dashboard under Publisher > Settings."
            exit 1
          fi

      # Uploads, waits up to 60 seconds for the upload to finish, then publishes with
      # DEFAULT_PUBLISH. Visibility comes from the Developer Dashboard.
      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/*-chrome.zip
          extension-id: bgildcbomgimjfoblhlhmaehaeieeaam
          publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
          glob: true

  publish-to-firefox:
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      # Checkout first: it cleans the workspace, so it must run before the download.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      - name: Upload to Firefox Add-ons
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'geocaching-friends-logs@rfsbraz.github.io'
          xpi-path: dist/*-firefox.zip
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The action cannot send release notes or previews, so this step does it with the
      # same AMO key: the CHANGELOG.md section for this version becomes the release
      # notes, and store-listing/assets/screenshot-N.png replace the listing previews.
      # See store-listing/FIREFOX_RELEASE.md.
      - name: Set AMO release notes and previews
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-release.js --apply

  publish-to-edge:
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      # Checkout first: it cleans the workspace, so it must run before the download.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Testing steps from store-listing/edge-certification-notes.txt plus the
      # CHANGELOG.md section for this version. See store-listing/EDGE_CERTIFICATION.md.
      - name: Build notes for certification
        id: notes
        run: node scripts/edge-cert-notes.js --github-output

      - name: Upload to Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: dist/*-edge.zip
          notes-for-certification: ${{ steps.notes.outputs.notes }}
