name: Store credentials

# Weekly check that the store publishing credentials still work.
# The Chrome token exchange also keeps the refresh token in use.
# See CONTRIBUTING.md "Store credentials check".

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Edge Add-ons API keys expire. Update this date when you create a new key.
  EDGE_API_KEY_EXPIRES: '2026-12-24'
  ISSUE_TITLE: 'Store credentials need renewal'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.check.outputs.failed }}
      warned: ${{ steps.check.outputs.warned }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Chrome and Edge credentials
        id: check
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Optional. When set, the Chrome check uses the V2 API (V1.1 ends 2026-10-15).
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          REPORT_FILE: store-report.md
        run: |
          status=0
          ./scripts/check-store-credentials.sh || status=$?
          cat store-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-report
          path: store-report.md
          retention-days: 7

  report:
    # Opens or updates one issue on failure or when the Edge key is close to expiry.
    # Closes that issue when a later run passes with no warnings.
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: store-report

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_RESULT: ${{ needs.check.result }}
          FAILED: ${{ needs.check.outputs.failed }}
          WARNED: ${{ needs.check.outputs.warned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")"

          if [ "$CHECK_RESULT" = "success" ] && [ "$WARNED" != "1" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All store credential checks passed in $RUN_URL. Closing."
            fi
            exit 0
          fi

          {
            echo "The store credentials check needs attention. Run: $RUN_URL"
            echo
            if [ -s store-report.md ]; then cat store-report.md; else echo "- The check job did not produce a report (result: $CHECK_RESULT)."; fi
            echo
            echo "See CONTRIBUTING.md, section \"Store credentials check\", for how to renew each credential."
          } > body.md

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # Re-enabling this workflow through the API resets that timer. No commits needed.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/store-credentials.yml/enable" --silent
