<!-- Trimmed from the logged-out https://www.geocaching.com/geocache/GC9P5DP page, fetched 2026-10-12.
     Only the logbook contract is kept: page globals, the log row templates and their registration.
     userToken is redacted. Logged-out pages do not render #cache_logs_table; the site bundle
     (cachedetails-main) still targets it. Live check: node scripts/check-site-contract.js -->
<html><head>
    <script type="text/javascript">
        var userToken = null,
            urlParams = {},
            mapLatLng = null,
            cmapAdditionalWaypoints = [],
            initialLogs = null, totalLogs = 0, includeAvatars = false;

    </script>
</head><body>
    <script id="tmpl_CacheLogRow" type="text/x-jquery-tmpl">
        <tr class="log-row l-${LogID}" data-encoded="${IsEncoded}">
            <td>
                <div class="log-row-body">
                    <div class="LogDisplayLeft">
                        <a href="/profile/?guid=${AccountGuid}" class="h5">${UserName}</a>
                        <p class="log-meta small">
                            <img class="icon" height="11" width="11" alt="" src="${creator.GroupImageUrl}">${creator.GroupTitle}
                        </p>
                        <a href="/profile/?guid=${AccountGuid}" class="log-avatar">
                            {{if includeAvatars && AvatarImage}}
                                <img width="48" height="48" src="https://img.geocaching.com/user/avatar/${AvatarImage}" alt="Profile photo for ${UserName}">
                            {{else includeAvatars }}
                                <img width="48" height="48" src="/images/default_avatar.png" alt="Profile photo for ${UserName}">
                            {{/if}}
                        </a>
                        {{if GeocacheFindCount > 0 }}
                        <p class="log-meta">
                            <img class="icon" height="16" width="16" title="Caches Found" src="/images/logtypes/2.png">${GeocacheFindCount}
                        </p>
                        {{/if}}
                    </div>
                    <div class="LogDisplayRight">
                        <div class="log-row-header">
                            <div class="LogType">
                                <span class="h4 log-meta flex">
                                    <img class="icon" height="17" width="17" title="${getLocalizedLogType(LogTypeID, LogType)}" alt="" src="/images/logtypes/${LogTypeImage}">
                                    {{if FavoritePointUsed }}
                                        <svg aria-hidden="true" role="img" height="16" width="16" class="min-w-4 -ml-2 mr-1 text-green-500" alt="">
                                            <use href="#heart_cache_favorited--inline" />
                                        </svg>
                                    {{/if}}
                                    ${getLocalizedLogType(LogTypeID, LogType)}
                                </span>
                            </div>
                            <div class="LogDate">
                                <span class="minorDetails">${Visited}</span>
                            </div>
                        </div>
                        <div class="LogContent markdown-output">
                            {{if LatLonString.length > 0}}
                                <span class="WaypointLog">${LatLonString}</span>
                            {{/if}}
                            <div class="LogText">{{html LogText}}</div>
                            {{if Images.length > 0}}
                                <ul class="LogImagesTable flex flex-col gap-1">
                                    {{tmpl(Images) "tmplCacheLogImages"}}
                                </ul>
                            {{/if}}
                        </div>

                        <div class="log-cta">
                            {{if LogType === "Found it" || LogType === "Didn't find it" || LogType === "Webcam Photo Taken" || LogType === "Attended" || LogType === "Announcement" }}
                                <div class="upvotes">
                                    <button class="great-story-btn focus:shadow-outline"
                                            type="button" 
                                            data-log-id="${LogID}" 
                                            data-upvoted="false" 
                                            data-upvote-type="1" 
                                            {{if userInfo.ID == AccountID}}
                                                title="You cannot vote for your own logs."
                                            {{else}}
                                                title="Was this a great story?"
                                            {{/if}}
                                            {{if userInfo.ID == AccountID}}disabled{{/if}}>                
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                                          <g>
                                            <g stroke-width="1.125" transform="translate(4 3)">
                                              <path d="M2,0 L16,0 L16,18 L2,18 L2,18 C0.8954305,18 1.3527075e-16,17.1045695 0,16 L0,2 L0,2 C-1.3527075e-16,0.8954305 0.8954305,2.02906125e-16 2,0 Z"/>
                                              <path d="M4.5,0.5 L4.5,17.5" stroke-linecap="square"/>
                                              <polygon points="9 0 13 0 13 8 11 6 9 8"/>
                                            </g>
                                          </g>
                                        </svg>
                                        <span>Great story</span>
                                    </button>
                                    <span class="loading-container hidden loading-${LogID}" role="status" aria-label="Loading">
                                        <img src="/app/ui-images/branding/loading-spinner.svg" alt="" aria-hidden="true" />
                                    </span>
                                    <button class="helpful-btn focus:shadow-outline" 
                                            type="button" data-log-id="${LogID}"
                                            data-upvoted="false" 
                                            data-upvote-type="2" 
                                            {{if userInfo.ID == AccountID}}
                                                title="You cannot vote for your own logs."
                                            {{else}}
                                                title="Was this helpful?"
                                            {{/if}}
                                            {{if userInfo.ID == AccountID}}disabled{{/if}}>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 21.55 21.29" aria-hidden="true">
                                          <g>
                                            <g>
                                              <path d="M21.3 13.38a1.08 1.08 0 0 1-.18.6 1 1 0 0 1-1.41.34l-1.29-.89-2.33-1.55-.15.21 3.63 2.43a1.12 1.12 0 0 1 .29 1.48 1.1 1.1 0 0 1-.7.47 1 1 0 0 1-.78-.17l-3.69-2.47-.14.19 3.81 2.59a1.1 1.1 0 0 1 .29 1.51 1 1 0 0 1-1.42.32L13.3 15.8l-.14.2L17 18.58a.48.48 0 0 1 .11.09 1.08 1.08 0 0 1 .17 1.42 1 1 0 0 1-.67.46 1 1 0 0 1-.8-.16l-1.43-1a1.84 1.84 0 0 0-.8-1.39 1.77 1.77 0 0 0-1-.31 1.84 1.84 0 0 0-.33 0 1.67 1.67 0 0 0-.3.08 1.83 1.83 0 0 0-.74-1.88 1.77 1.77 0 0 0-1-.3 1.5 1.5 0 0 0-.35 0 1.58 1.58 0 0 0-.31.09 1.77 1.77 0 0 0-1.73-2.19h-.33a1.7 1.7 0 0 0-.45.15 1.7 1.7 0 0 0-.66-1.83 1.58 1.58 0 0 0-.91-.28 1.35 1.35 0 0 0-.33 0 1.67 1.67 0 0 0-1.06.71l-.3.46a5.17 5.17 0 0 1-.43-2.13L0 8.31 4.92.9l3.32 2.31A2.67 2.67 0 0 1 11.52 3a4.19 4.19 0 0 0-2.75 1.16C7.79 5.33 6.17 7.79 6.05 8H6v.06a2 2 0 0 0 .3 1.68 1.07 1.07 0 0 0 .42.33 1.62 1.62 0 0 0 .72.17 1.54 1.54 0 0 0 1.09-.45l1.31-2a2.44 2.44 0 0 0 1.49.63 2 2 0 0 0 .42 0 2.12 2.12 0 0 0 .67-.3 2.61 2.61 0 0 0 .78-.7l6.58 4.41 1 .65a1.09 1.09 0 0 1 .45.69.82.82 0 0 1 .07.21z"/>
                                              <path d="M9.23 15.31a1 1 0 0 1 0 .17.8.8 0 0 1 0 .15 1.33 1.33 0 0 1 0 .19l-.15.18a1.09 1.09 0 0 1-.08.15l-.16.24L8 17.55a1.43 1.43 0 0 1-.2.23 1.43 1.43 0 0 1-.7.36 1.23 1.23 0 0 1-.27 0 1.42 1.42 0 0 1-.8-.24 1.49 1.49 0 0 1-.5-1.8 1.74 1.74 0 0 1 .1-.19l1-1.44a1.43 1.43 0 0 1 .89-.57 1.23 1.23 0 0 1 .27 0 1.44 1.44 0 0 1 .8.24 1.55 1.55 0 0 1 .27.24 1.32 1.32 0 0 1 .19.29 2.19 2.19 0 0 1 .12.33 1.39 1.39 0 0 1 .06.31zM11.58 17.75a2.33 2.33 0 0 1-.14.33.34.34 0 0 1-.06.12l-.75 1.14a1 1 0 0 1-.13.16 1.38 1.38 0 0 1-.79.45 1.14 1.14 0 0 1-.26 0 1.38 1.38 0 0 1-.8-.25 1.47 1.47 0 0 1-.53-1.7 1.22 1.22 0 0 1 .14-.28L9 16.56a1.48 1.48 0 0 1 .33-.33 1.33 1.33 0 0 1 .6-.23 1.23 1.23 0 0 1 .27 0 1.41 1.41 0 0 1 .79.24 1.48 1.48 0 0 1 .59 1.51zM13.76 20.3l-.37.55a1.29 1.29 0 0 1-1.13.44 5 5 0 0 1-.88-.09 1.48 1.48 0 0 1-.55-1.56.27.27 0 0 0 .09-.1l.75-1.14.05-.08.08-.07a1.26 1.26 0 0 1 .26-.13 1.05 1.05 0 0 1 .24-.06 1.06 1.06 0 0 1 .25 0A1.41 1.41 0 0 1 14 19.15a1.48 1.48 0 0 1-.24 1.15zM11.8 18.24l-.08.07z"/>
                                              <path d="M11.72 18.3l.08-.07z" />
                                              <path d="M20.05 9.92a2.33 2.33 0 0 1-.19 1.44l-6.68-4.48-.06.12a2.34 2.34 0 0 1-.92.85 2 2 0 0 1-.48.19 1.24 1.24 0 0 1-.33 0A2.15 2.15 0 0 1 10 7.36l-.11-.12L8.3 9.57a1.22 1.22 0 0 1-.85.35 1.17 1.17 0 0 1-.57-.14.83.83 0 0 1-.31-.24 1.17 1.17 0 0 1-.23-.44 2.21 2.21 0 0 1 0-.93C6.5 7.93 8.09 5.52 9 4.39a4 4 0 0 1 2.71-1h.54L14.53 0l7 4.93-2.17 3.33v.07a5.38 5.38 0 0 1 .69 1.59zM6.52 14l-.13.2v.06l-1 1.45a1.36 1.36 0 0 1-.84.55 1 1 0 0 1-.24 0 1.26 1.26 0 0 1-.73-.23 1.37 1.37 0 0 1-.35-1.84l1.14-1.71a1.33 1.33 0 0 1 .84-.48 1.06 1.06 0 0 1 .25 0 1.22 1.22 0 0 1 .71.22A1.37 1.37 0 0 1 6.52 14z"/>
                                            </g>
                                          </g>
                                        </svg>
                                        <span>Helpful</span>
                                    </button>
                                </div>
                            {{/if}}
                        
                            <div class="AlignRight">
                                <small>
                                    <a title="View Log" href="/seek/log.aspx?LUID=${LogGuid}" target="_blank" class="text-blue-600 underline hover:no-underline rounded focus:shadow-outline">
                                        
                                        {{if (userInfo.ID==AccountID && (LogTypeID != 18 && LogTypeID != 76))}}
                                           View / Edit Log / Images
                                        {{else}}
                                           View Log
                                        {{/if}}
                                    </a>
                                </small>&nbsp;
                            </div>
                        </div>

                    </div>
                </div>
            </td>
        </tr>
    </script>
    <script id="tmpl_CacheLogImages" type="text/x-jquery-tmpl">
    <li>
        <a class="tb_images lnk flex gap-2 items-center leading-5 py-[2px] rounded focus:shadow-outline"
           rel="tb_images[grp${LogID}]"
           href="https://img.geocaching.com/cache/log/large/${FileName}"
           data-image-name="${$item.data.Name}"
           data-image-file-name="${FileName}"
           data-image-guid="${ImageGuid}"
           data-log-guid="${$item.parent.data.LogGuid}"
           data-image-desc="${$item.data.Descr}">
            <img title="Photo" alt="Photo" src="/images/icons/16/photo.png" height="16" width="16" class="icon" />
            <span>${$item?.data?.Name?.trim()?.length > 0 ? $item?.data?.Name : $item?.data?.Descr}</span>
        </a>
    </li>
</script>
<script type="text/javascript">
        $("#tmpl_CacheLogImages").template("tmplCacheLogImages");
        $("#tmpl_CacheLogRow").template("tmplCacheLogRow");
</script>
<script type="text/javascript">
userInfo = {ID: 0};
userToken = 'REDACTED';
</script>
</body></html>
